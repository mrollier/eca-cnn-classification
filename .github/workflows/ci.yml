name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # TensorFlow 2.15 (pinned: the chapter's version, Keras 2) supports Python <= 3.11.
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Reproduce (quick)
        run: python reproduce.py quick
      - name: Committed results are unchanged by the reproduction
        # reproduce.py quick regenerates the datasets from their seeds and
        # every result derived from them without training; a diff here means
        # the code (or the platform) no longer produces the committed numbers.
        run: |
          git diff --exit-code -- data/results
          test -z "$(git status --porcelain -- data/results)"   # no new, unexpected files either
